<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coro "Mariagrazia De Padova"</title>
  <meta name="theme-color" content="#1e40af">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --primary: #1e40af;
      --primary-light: #dbeafe;
      --primary-dark: #1e3a8a;
      --accent: #d97706;
      --bg-main: #f8fafc;
      --bg-surface: #ffffff;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-full: 9999px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 14px rgba(0,0,0,0.08);
      --shadow-lg: 0 10px 25px rgba(30, 64, 175, 0.12);
    }

    body.dark {
      --bg-main: #0b0f19;
      --bg-surface: #131c2e;
      --bg-card: #131c2e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #1e293b;
      --primary-light: #1e3a8a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.5;
      padding-bottom: 90px;
      transition: background-color 0.3s, color 0.3s;
    }

    h1, h2, h3 { font-family: 'Plus Jakarta Sans', sans-serif; }
    .container { max-width: 768px; margin: 0 auto; padding: 16px; }

    .top-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      position: sticky; top: 0; z-index: 40; backdrop-filter: blur(10px);
    }
    .brand { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .brand-logo {
      width: 42px; height: 42px; border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 10px rgba(30, 64, 175, 0.3);
    }
    .brand-info h1 { font-size: 1.1rem; font-weight: 700; }
    .brand-info p { font-size: 0.75rem; color: var(--text-muted); }

    .icon-btn {
      width: 40px; height: 40px; border-radius: var(--radius-full);
      border: 1px solid var(--border-color); background: var(--bg-surface);
      color: var(--text-main); display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s;
    }

    .view-page { display: none; }
    .view-page.active { display: block; animation: fadeIn 0.25s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    .hero-banner {
      background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
      color: white; border-radius: var(--radius-lg); padding: 24px; margin-bottom: 20px;
      box-shadow: var(--shadow-lg);
    }
    .hero-banner h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 6px; }
    .hero-banner p { font-size: 0.9rem; opacity: 0.9; margin-bottom: 16px; }
    
    .user-profile-box {
      background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(8px);
      border-radius: var(--radius-md); padding: 12px 16px; margin-bottom: 16px;
    }
    .user-profile-box label { font-size: 0.75rem; text-transform: uppercase; font-weight: 700; display: block; margin-bottom: 8px; }
    .role-buttons { display: flex; gap: 6px; flex-wrap: wrap; }
    .role-btn {
      padding: 6px 12px; border-radius: var(--radius-full); border: 1px solid rgba(255,255,255,0.3);
      background: rgba(0,0,0,0.15); color: white; font-size: 0.8rem; font-weight: 600; cursor: pointer;
    }
    .role-btn.active { background: white; color: var(--primary); border-color: white; }

    .search-box { position: relative; margin-bottom: 16px; }
    .search-box input {
      width: 100%; padding: 14px 16px 14px 48px; border-radius: var(--radius-md);
      border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-main);
      font-size: 0.95rem; outline: none; box-shadow: var(--shadow-sm);
    }
    .search-box i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

    .songs-grid { display: flex; flex-direction: column; gap: 12px; }
    .song-card {
      background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md);
      padding: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
      transition: all 0.2s; cursor: pointer; box-shadow: var(--shadow-sm);
    }
    .song-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--primary); }
    .song-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 4px; }
    .song-meta { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--text-muted); }
    .category-badge { background: var(--primary-light); color: var(--primary); padding: 2px 8px; border-radius: 6px; font-weight: 600; }

    .back-bar { margin-bottom: 16px; }
    .btn-back {
      background: var(--bg-surface); border: 1px solid var(--border-color); color: var(--text-main);
      padding: 8px 14px; border-radius: var(--radius-full); font-size: 0.85rem; font-weight: 600;
      display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    }

    .player-card {
      background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-lg);
      padding: 20px; text-align: center; box-shadow: var(--shadow-md); margin-bottom: 24px;
    }
    .player-card h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 4px; }
    .player-card p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 12px; }

    .active-voice-badge {
      display: inline-flex; align-items: center; gap: 6px; background: var(--primary-light); color: var(--primary);
      padding: 4px 12px; border-radius: var(--radius-full); font-size: 0.8rem; font-weight: 700; margin-bottom: 16px;
    }

    .mix-selector { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 16px; }
    .mix-btn {
      flex: 1; min-width: 65px; padding: 10px 6px; border-radius: 10px; border: 1px solid var(--border-color);
      background: var(--bg-main); color: var(--text-main); font-size: 0.75rem; font-weight: 700; cursor: pointer; text-align: center;
      transition: all 0.2s;
    }
    .mix-btn.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 10px rgba(30, 64, 175, 0.25); }
    .mix-btn.solo-btn { background: #d97706; color: white; border-color: #d97706; }

    .spotify-lyrics-container {
      padding: 10px 0 40px 0; margin-bottom: 24px; text-align: center;
      scroll-behavior: smooth; position: relative;
    }
    .lyric-line {
      font-size: 1.25rem; font-weight: 600; color: var(--text-muted); padding: 14px 16px;
      margin: 6px 0; border-radius: 12px; transition: all 0.3s ease; cursor: pointer; opacity: 0.35;
      line-height: 1.5;
    }
    .lyric-line:hover { opacity: 0.7; }
    .lyric-line.active {
      font-size: 1.6rem; font-weight: 800; color: var(--primary); opacity: 1;
      transform: scale(1.03); text-shadow: 0 4px 20px rgba(30,64,175,0.15);
    }
    body.dark .lyric-line.active { color: #60a5fa; text-shadow: 0 4px 20px rgba(96,165,250,0.25); }

    .lyric-section-tag {
      font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; color: var(--accent);
      font-weight: 800; margin: 36px 0 16px 0; border-top: 2px solid var(--border-color); padding-top: 20px;
    }

    .progress-bar-bg { width: 100%; height: 8px; background: var(--border-color); border-radius: 4px; overflow: hidden; cursor: pointer; margin-bottom: 8px; }
    .progress-bar-fill { width: 0%; height: 100%; background: var(--primary); transition: width 0.1s linear; }
    .time-labels { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 16px; }

    .controls-row { display: flex; align-items: center; justify-content: center; gap: 16px; }
    .btn-circle {
      width: 42px; height: 42px; border-radius: var(--radius-full); border: 1px solid var(--border-color);
      background: var(--bg-main); color: var(--text-main); display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .btn-play-lg {
      width: 64px; height: 64px; border-radius: var(--radius-full); background: var(--primary); color: white; border: none;
      display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 15px rgba(30,64,175,0.3);
    }

    .extra-box {
      background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-lg);
      padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow-sm);
    }
    .extra-box h3 { font-size: 1rem; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .comment-content { font-size: 0.9rem; color: var(--text-muted); line-height: 1.6; white-space: pre-line; }
    
    .btn-pdf {
      display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
      background: var(--primary-light); color: var(--primary); padding: 12px; border-radius: var(--radius-md);
      text-decoration: none; font-weight: 700; font-size: 0.9rem;
    }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: var(--bg-surface);
      border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; z-index: 50;
    }
    .nav-button {
      background: none; border: none; color: var(--text-muted); display: flex; flex-direction: column;
      align-items: center; gap: 4px; font-size: 0.75rem; font-weight: 600; cursor: pointer; width: 33%; padding: 8px 0;
    }
    .nav-button.active { color: var(--primary); }

    @media (min-width: 768px) {
      body { padding-bottom: 0; }
      .bottom-nav { position: relative; top: 0; border-top: none; border-bottom: 1px solid var(--border-color); background: transparent; height: 60px; }
    }
  </style>
</head>
<body>

  <header class="top-header">
    <div class="brand" onclick="vaiAllaHome()">
      <div class="brand-logo"><i data-lucide="music"></i></div>
      <div class="brand-info">
        <h1>Coro "M. De Padova"</h1>
        <p>App Prove & Spartiti</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="btnThemeToggle" title="Cambia Tema"><i data-lucide="moon" id="themeIcon"></i></button>
    </div>
  </header>

  <main class="container">

    <!-- HOME -->
    <section id="viewDashboard" class="view-page active">
      <div class="hero-banner">
        <h2>Pronti per le Prove?</h2>
        <p>Seleziona la tua voce principale o ascolta l'esecuzione completa.</p>
        
        <div class="user-profile-box">
          <label><i data-lucide="mic" style="width:14px;height:14px;display:inline;"></i> La tua voce principale:</label>
          <div class="role-buttons">
            <button class="role-btn" data-role="tutti">Tutte</button>
            <button class="role-btn active" data-role="soprano">Soprano</button>
            <button class="role-btn" data-role="contralto">Contralto</button>
            <button class="role-btn" data-role="tenore">Tenore</button>
            <button class="role-btn" data-role="basso">Basso</button>
          </div>
        </div>
      </div>

      <div class="search-box">
        <i data-lucide="search"></i>
        <input type="search" id="inputSearch" placeholder="Cerca un canto nel repertorio...">
      </div>

      <div class="songs-grid" id="listaTuttiCanti"></div>
    </section>

    <!-- PLAYER CANTO -->
    <section id="viewCanto" class="view-page">
      <div class="back-bar">
        <button class="btn-back" onclick="vaiAllaHome()"><i data-lucide="arrow-left"></i> Torna ai canti</button>
      </div>

      <div class="player-card">
        <h2 id="playerSongTitle">Titolo Canto</h2>
        <p id="playerSongAuthor">Autore</p>
        
        <div class="active-voice-badge">
          <i data-lucide="sliders"></i> Ascolto: <span id="labelVoceAttiva">Soprano</span>
        </div>

        <div class="mix-selector" id="mixSelectorBox"></div>

        <div class="progress-bar-bg" id="progressBarBg">
          <div class="progress-bar-fill" id="progressBarFill"></div>
        </div>
        <div class="time-labels">
          <span id="currentTimeLabel">00:00</span>
          <span id="durationTimeLabel">00:00</span>
        </div>

        <div class="controls-row">
          <button class="btn-circle" onclick="saltaTempo(-5)"><i data-lucide="rotate-ccw"></i></button>
          <button class="btn-play-lg" id="btnPlayPause" onclick="togglePlay()"><i data-lucide="play" id="playIcon"></i></button>
          <button class="btn-circle" onclick="saltaTempo(5)"><i data-lucide="rotate-cw"></i></button>
        </div>
      </div>

      <!-- SPOTIFY LYRICS FLUIDO -->
      <div class="spotify-lyrics-container" id="spotifyLyricsBox"></div>

      <!-- SPARTITO -->
      <div class="extra-box" id="boxSpartito">
        <h3><i data-lucide="file-text" style="color:var(--primary)"></i> Spartito Musicale</h3>
        <a id="linkSpartitoPdf" href="#" target="_blank" class="btn-pdf">
          <i data-lucide="download"></i> Apri o Scarica Spartito PDF
        </a>
      </div>

      <!-- COMMENTO -->
      <div class="extra-box" id="boxCommento">
        <h3><i data-lucide="message-square" style="color:var(--primary)"></i> Note per il Coro</h3>
        <p class="comment-content" id="testoCommento">Nessuna nota inserita per questo canto.</p>
      </div>
    </section>

  </main>

  <nav class="bottom-nav">
    <button class="nav-button active" onclick="vaiAllaHome()"><i data-lucide="home"></i> Home</button>
  </nav>

  <!-- ELEMENTI AUDIO MULTIPLI -->
  <audio id="audioSoprano" preload="auto"></audio>
  <audio id="audioContralto" preload="auto"></audio>
  <audio id="audioTenore" preload="auto"></audio>
  <audio id="audioBasso" preload="auto"></audio>
  <audio id="audioTutti" preload="auto"></audio>

  <script>
    let canti = [];
    let cantoCorrente = null;
    let voceSelezionata = localStorage.getItem("ruoloCorista") || "soprano";
    let isSoloMode = false; // Flag per la modalità solo voce (azzera il mixer)
    let isPlaying = false;
    let updateInterval = null;
    
    let utenteStaScorrendo = false;
    let timeoutScorrimento = null;

    // Sottofondo impostato al 20% (0.20)
    const VOLUME_SFONDO = 0.20;

    const audios = {
      soprano: document.getElementById("audioSoprano"),
      contralto: document.getElementById("audioContralto"),
      tenore: document.getElementById("audioTenore"),
      basso: document.getElementById("audioBasso"),
      tutti: document.getElementById("audioTutti")
    };

    window.addEventListener("DOMContentLoaded", async () => {
      lucide.createIcons();
      initTheme();
      initRuoloCorista();
      await caricaRepertorio();
      
      window.addEventListener("popstate", gestisciRoutingURL);
      gestisciRoutingURL();

      document.getElementById("progressBarBg").onclick = (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        const pos = (e.clientX - rect.left) / rect.width;
        const dur = getDurataValida();
        if (dur > 0) saltaAlTempo(pos * dur);
      };

      window.addEventListener("wheel", gestisciInterazioneUtente);
      window.addEventListener("touchstart", gestisciInterazioneUtente);
    });

    function gestisciInterazioneUtente() {
      utenteStaScorrendo = true;
      if (timeoutScorrimento) clearTimeout(timeoutScorrimento);
      timeoutScorrimento = setTimeout(() => {
        utenteStaScorrendo = false;
      }, 5000);
    }

    async function caricaRepertorio() {
      try {
        const res = await fetch("dati/canti.json");
        if (res.ok) canti = await res.json();
      } catch (e) { console.error("Errore caricamento repertorio:", e); }
      renderListaCanti(canti);
    }

    function renderListaCanti(lista) {
      const container = document.getElementById("listaTuttiCanti");
      container.innerHTML = "";
      if (lista.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:20px; color:var(--text-muted)">Nessun canto trovato</div>`;
        return;
      }

      lista.forEach(c => {
        const card = document.createElement("div");
        card.className = "song-card";
        card.innerHTML = `
          <div>
            <div class="song-title">${c.titolo}</div>
            <div class="song-meta">
              <span class="category-badge">${c.categoria || 'Coro'}</span>
              <span>${c.autore || ''}</span>
            </div>
          </div>
          <button class="icon-btn" style="background:var(--primary); color:white; border:none;"><i data-lucide="play"></i></button>
        `;
        card.onclick = () => apriCantoPerSlug(c.id);
        container.appendChild(card);
      });
      lucide.createIcons();
    }

    function apriCantoPerSlug(id) {
      history.pushState({ id: id }, "", `${id}`);
      gestisciRoutingURL();
    }

    async function gestisciRoutingURL() {
      const path = window.location.pathname.replace(/^\/+/, '');
      if (path && path !== "" && path !== "index.html") {
        const cantoBase = canti.find(c => c.id === path || (c.file && c.file.includes(path)));
        if (cantoBase) {
          await caricaDettagliCanto(cantoBase);
          mostraVista("viewCanto");
          return;
        }
      }
      mostraVista("viewDashboard");
      fermaTutto();
    }

    function vaiAllaHome() {
      fermaTutto();
      history.pushState({}, "", "./");
      mostraVista("viewDashboard");
    }

    function mostraVista(idVista) {
      document.querySelectorAll(".view-page").forEach(v => v.classList.remove("active"));
      document.getElementById(idVista).classList.add("active");
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function caricaDettagliCanto(cantoBase) {
      let fileJson = cantoBase.file;
      if (!fileJson && cantoBase.id) fileJson = `canti/${cantoBase.id}.json`;

      try {
        const res = await fetch(fileJson);
        if (res.ok) cantoCorrente = await res.json();
        else cantoCorrente = cantoBase;
      } catch (e) { cantoCorrente = cantoBase; }

      document.getElementById("playerSongTitle").textContent = cantoCorrente.titolo || cantoBase.titolo;
      document.getElementById("playerSongAuthor").textContent = cantoBase.autore || cantoBase.categoria || "";

      const traccePresenti = cantoCorrente.tracce || {};
      for (let voce in audios) {
        if (traccePresenti[voce]) {
          audios[voce].src = traccePresenti[voce];
          audios[voce].load();
        } else {
          audios[voce].removeAttribute("src");
        }
      }

      isSoloMode = false;
      generaSelettoreVociDinamico(traccePresenti);
      applicaMixVolumi();
      generaLyricsSpotify();

      const boxSpartito = document.getElementById("boxSpartito");
      const pdfUrl = cantoCorrente.spartito || cantoBase.spartito;
      if (pdfUrl) {
        boxSpartito.style.display = "block";
        document.getElementById("linkSpartitoPdf").href = pdfUrl;
      } else { boxSpartito.style.display = "none"; }

      const boxCommento = document.getElementById("boxCommento");
      const notaTesto = cantoCorrente.commento || cantoCorrente.note;
      if (notaTesto) {
        boxCommento.style.display = "block";
        document.getElementById("testoCommento").textContent = notaTesto;
      } else { boxCommento.style.display = "none"; }
    }

    function generaSelettoreVociDinamico(tracce) {
      const container = document.getElementById("mixSelectorBox");
      container.innerHTML = "";

      const vociDisponibili = Object.keys(tracce).filter(v => tracce[v]);

      // Tasto TUTTE
      const btnTutti = document.createElement("button");
      btnTutti.className = "mix-btn";
      btnTutti.dataset.mix = "tutti";
      btnTutti.textContent = "Tutte";
      btnTutti.onclick = () => { isSoloMode = false; cambiaVoceMix("tutti"); };
      container.appendChild(btnTutti);

      // Tasti singole voci
      vociDisponibili.forEach(v => {
        if (v === "tutti") return;
        const btn = document.createElement("button");
        btn.className = "mix-btn";
        btn.dataset.mix = v;
        btn.textContent = v.charAt(0).toUpperCase() + v.slice(1);
        btn.onclick = () => {
          if (voceSelezionata === v) {
            // Se clicchi di nuovo sulla stessa voce, attivi/disattivi la modalità SOLO (Mute mixer)
            isSoloMode = !isSoloMode;
          } else {
            voceSelezionata = v;
            isSoloMode = false;
          }
          applicaMixVolumi();
        };
        container.appendChild(btn);
      });

      // Tasto rapido "SOLO VOCE" (Azzera le altre)
      const btnSolo = document.createElement("button");
      btnSolo.className = "mix-btn solo-btn";
      btnSolo.id = "btnToggleSolo";
      btnSolo.textContent = "Solo";
      btnSolo.title = "Lascia solo la voce selezionata (azzera le altre)";
      btnSolo.onclick = () => {
        if (voceSelezionata === "tutti") voceSelezionata = "soprano";
        isSoloMode = !isSoloMode;
        applicaMixVolumi();
      };
      container.appendChild(btnSolo);

      if (voceSelezionata !== "tutti" && !tracce[voceSelezionata]) {
        voceSelezionata = "tutti";
      }
    }

    function cambiaVoceMix(voce) {
      voceSelezionata = voce;
      isSoloMode = false;
      applicaMixVolumi();
    }

    function applicaMixVolumi() {
      document.querySelectorAll(".mix-btn").forEach(b => {
        if (b.dataset.mix) {
          b.classList.toggle("active", b.dataset.mix === voceSelezionata && !isSoloMode);
        }
      });

      const btnSolo = document.getElementById("btnToggleSolo");
      if (btnSolo) {
        btnSolo.classList.toggle("active", isSoloMode);
      }

      let labelText = "";
      if (voceSelezionata === "tutti") {
        labelText = "Tutte le voci (100%)";
      } else if (isSoloMode) {
        labelText = `Solo ${voceSelezionata.charAt(0).toUpperCase() + voceSelezionata.slice(1)} (Mix Azzerato)`;
      } else {
        labelText = `${voceSelezionata.charAt(0).toUpperCase() + voceSelezionata.slice(1)} (Guida) + 20% Sottofondo`;
      }
      document.getElementById("labelVoceAttiva").textContent = labelText;

      for (let v in audios) {
        if (!audios[v].src) continue;

        if (voceSelezionata === "tutti") {
          audios[v].volume = 1.0;
        } else if (v === voceSelezionata) {
          audios[v].volume = 1.0; // Voce principale al 100%
        } else {
          audios[v].volume = isSoloMode ? 0.0 : VOLUME_SFONDO; // 0% se in modalità Solo, altrimenti 20%
        }
      }
    }

    function generaLyricsSpotify() {
      const container = document.getElementById("spotifyLyricsBox");
      container.innerHTML = "";

      let listaRighe = cantoCorrente.righe || [];

      if (listaRighe.length === 0 && cantoCorrente.sezioni) {
        cantoCorrente.sezioni.forEach(sez => {
          const righeSez = sez.testo.split("\n");
          let durata = sez.fine - sez.inizio;
          let passo = durata / righeSez.length;

          righeSez.forEach((riga, i) => {
            if (riga.trim() !== "") {
              listaRighe.push({
                sezione: sez.nome,
                testo: riga,
                tempo: sez.inizio + (i * passo)
              });
            }
          });
        });
      }

      if (listaRighe.length === 0) {
        container.innerHTML = `<p style="color:var(--text-muted)">Testo non disponibile per questo canto.</p>`;
        return;
      }

      let ultimaSezione = "";

      listaRighe.forEach((item) => {
        if (item.sezione && item.sezione !== ultimaSezione) {
          ultimaSezione = item.sezione;
          const tag = document.createElement("div");
          tag.className = "lyric-section-tag";
          tag.textContent = ultimaSezione;
          container.appendChild(tag);
        }

        const div = document.createElement("div");
        div.className = "lyric-line";
        div.textContent = item.testo;
        div.dataset.time = item.tempo;
        div.onclick = () => saltaAlTempo(item.tempo);
        container.appendChild(div);
      });
    }

    function togglePlay() {
      if (isPlaying) {
        fermaTutto();
      } else {
        const t = getTempoAttuale();
        avviaTuttiGliAudio(t);
      }
    }

    function avviaTuttiGliAudio(tempoInizio) {
      let t = tempoInizio || 0;

      for (let v in audios) {
        if (audios[v].src) {
          audios[v].pause();
          audios[v].currentTime = t;
        }
      }

      setTimeout(() => {
        let playPromises = [];
        for (let v in audios) {
          if (audios[v].src) {
            let p = audios[v].play();
            if (p !== undefined) playPromises.push(p);
          }
        }

        if (playPromises.length > 0) {
          Promise.all(playPromises).then(() => {
            isPlaying = true;
            document.getElementById("playIcon").setAttribute("data-lucide", "pause");
            lucide.createIcons();
            
            if (updateInterval) clearInterval(updateInterval);
            updateInterval = setInterval(aggiornaStatoPlayer, 150);
          }).catch(e => console.log("Errore riproduzione mobile:", e));
        }
      }, 80);
    }

    function fermaTutto() {
      for (let v in audios) {
        if (audios[v].src) audios[v].pause();
      }
      isPlaying = false;
      document.getElementById("playIcon").setAttribute("data-lucide", "play");
      lucide.createIcons();
      if (updateInterval) clearInterval(updateInterval);
    }

    function saltaAlTempo(secondi) {
      avviaTuttiGliAudio(secondi);
    }

    function saltaTempo(delta) {
      let nuovoTempo = Math.max(0, getTempoAttuale() + delta);
      avviaTuttiGliAudio(nuovoTempo);
    }

    function getTempoAttuale() {
      for (let v in audios) {
        if (audios[v].src && audios[v].currentTime > 0) return audios[v].currentTime;
      }
      return 0;
    }

    function getDurataValida() {
      for (let v in audios) {
        if (audios[v].src && audios[v].duration && !isNaN(audios[v].duration)) return audios[v].duration;
      }
      return 0;
    }

    function aggiornaStatoPlayer() {
      const cur = getTempoAttuale();
      const dur = getDurataValida();

      if (dur > 0) {
        document.getElementById("progressBarFill").style.width = `${(cur / dur) * 100}%`;
        document.getElementById("currentTimeLabel").textContent = formatTime(cur);
        document.getElementById("durationTimeLabel").textContent = formatTime(dur);
      }

      const linee = document.querySelectorAll(".lyric-line");
      let rigoAttivo = null;

      linee.forEach(l => {
        let t = parseFloat(l.dataset.time);
        if (cur >= t) rigoAttivo = l;
      });

      linee.forEach(l => l.classList.remove("active"));
      if (rigoAttivo) {
        rigoAttivo.classList.add("active");
        
        if (!utenteStaScorrendo) {
          rigoAttivo.scrollIntoView({ behavior: "smooth", block: "center" });
        }
      }
    }

    function formatTime(sec) {
      if (isNaN(sec)) return "00:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function initRuoloCorista() {
      document.querySelectorAll(".role-btn").forEach(btn => {
        if (btn.dataset.role === voceSelezionata) btn.classList.add("active");
        btn.onclick = () => {
          document.querySelectorAll(".role-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          voceSelezionata = btn.dataset.role;
          localStorage.setItem("ruoloCorista", voceSelezionata);
          applicaMixVolumi();
        };
      });
    }

    function initTheme() {
      if (localStorage.getItem("tema") === "dark") {
        document.body.classList.add("dark");
        document.getElementById("themeIcon").setAttribute("data-lucide", "sun");
      }
      document.getElementById("btnThemeToggle").onclick = () => {
        const isDark = document.body.classList.toggle("dark");
        localStorage.setItem("tema", isDark ? "dark" : "light");
        document.getElementById("themeIcon").setAttribute("data-lucide", isDark ? "sun" : "moon");
        lucide.createIcons();
      };
    }

    document.getElementById("inputSearch")?.addEventListener("input", (e) => {
      const q = e.target.value.toLowerCase();
      const filtrati = canti.filter(c => c.titolo.toLowerCase().includes(q) || (c.autore && c.autore.toLowerCase().includes(q)));
      renderListaCanti(filtrati);
    });
  </script>
</body>
